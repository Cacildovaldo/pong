<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Gerador de Imagens IA</title>
    <!-- Google Fonts: Space Grotesk & JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #06080d;
            color: #dde2f0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
        }

        /* ambient radial gradients (z-index background) */
        .ambient-gradients {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .gradient-blue {
            position: absolute;
            top: -20%;
            left: -20%;
            width: 70%;
            height: 70%;
            background: radial-gradient(ellipse at 30% 40%, rgba(91,143,255,0.07), transparent 70%);
            border-radius: 50%;
            filter: blur(60px);
        }
        .gradient-purple {
            position: absolute;
            bottom: -20%;
            right: -20%;
            width: 70%;
            height: 70%;
            background: radial-gradient(ellipse at 70% 80%, rgba(160,120,255,0.07), transparent 70%);
            border-radius: 50%;
            filter: blur(60px);
        }

        /* main grid layout */
        .app {
            position: relative;
            z-index: 2;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* topbar: 56px */
        .topbar {
            height: 56px;
            width: 100%;
            background: #0c0f18;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            padding: 0 28px;
            backdrop-filter: blur(2px);
        }
        .logo-mark {
            width: 26px;
            height: 26px;
            background: #5b8fff;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
        }
        .logo-mark svg {
            width: 14px;
            height: 14px;
            stroke: white;
            stroke-width: 2;
            fill: white;
        }
        .brand-text {
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: -0.2px;
            color: #dde2f0;
        }
        .brand-by {
            font-weight: 300;
            color: #4a5270;
            margin-left: 6px;
            font-size: 0.9rem;
        }

        /* two-column body: left 400px, right auto */
        .main-layout {
            flex: 1;
            display: flex;
            min-height: 0;
            overflow: hidden;
        }

        /* LEFT PANEL */
        .left-panel {
            width: 400px;
            background: #0c0f18;
            border-right: 1px solid rgba(255,255,255,0.06);
            display: flex;
            flex-direction: column;
            padding: 28px 24px;
            gap: 20px;
            overflow-y: auto;
            scrollbar-width: thin;
        }

        /* right panel */
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 36px;
            overflow: auto;
            position: relative;
        }

        /* muted label uppercase */
        .muted-label {
            font-size: 0.7rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #4a5270;
            font-weight: 500;
        }

        /* prompt container */
        .prompt-container {
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.06);
            background: transparent;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
        }
        .prompt-container:focus-within {
            border-color: rgba(91,143,255,0.35);
            box-shadow: 0 0 0 3px rgba(91,143,255,0.15);
        }
        textarea {
            width: 100%;
            background: transparent;
            border: none;
            padding: 16px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.95rem;
            line-height: 1.5;
            color: #dde2f0;
            resize: none;
            outline: none;
            min-height: 130px;
        }
        textarea::placeholder {
            font-style: italic;
            color: #4a5270;
            font-weight: 400;
        }
        /* toolbar inside prompt container */
        .toolbar {
            border-top: 1px solid rgba(255,255,255,0.06);
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .ratio-buttons {
            display: flex;
            gap: 12px;
        }
        .ratio-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 5px 8px;
            border-radius: 10px;
            transition: all 0.15s;
        }
        .ratio-btn svg rect {
            transition: fill 0.1s, stroke 0.1s;
        }
        .ratio-btn .ratio-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            color: #4a5270;
            letter-spacing: 0.2px;
        }
        .ratio-btn.active {
            background: rgba(91,143,255,0.1);
        }
        .ratio-btn.active .ratio-label {
            color: #5b8fff;
        }
        .char-counter {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: #4a5270;
        }
        /* error box */
        .error-box {
            background: rgba(220, 50, 70, 0.1);
            border-left: 3px solid #dc3246;
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 13px;
            color: #ff8a9c;
            display: none;
        }
        .error-box.show {
            display: block;
        }
        /* generate button */
        .generate-btn {
            background: #5b8fff;
            width: 100%;
            border: none;
            border-radius: 16px;
            padding: 14px 0;
            font-weight: 600;
            font-size: 14px;
            font-family: 'Space Grotesk', sans-serif;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 24px rgba(91,143,255,0.22);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            cursor: pointer;
        }
        .generate-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 8px 28px rgba(91,143,255,0.35);
        }
        .generate-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }
        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        .btn-icon {
            width: 18px;
            height: 18px;
            display: inline-flex;
        }
        .generate-btn.loading .btn-icon {
            display: none;
        }
        .generate-btn.loading .spinner {
            display: inline-block;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* tip with kbd */
        .tip-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: #4a5270;
            text-align: center;
            margin-top: 8px;
        }
        kbd {
            background: #1e2338;
            border-radius: 6px;
            padding: 2px 6px;
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            color: #b7c0e0;
            margin: 0 2px;
        }

        /* Right panel states */
        .state-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .empty-state, .result-state, .skeleton-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        .empty-state {
            opacity: 0.6;
            text-align: center;
            gap: 16px;
        }
        .icon-round {
            background: #111520;
            border: 1px solid rgba(255,255,255,0.06);
            width: 64px;
            height: 64px;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .empty-state h3 {
            font-weight: 500;
            font-size: 1rem;
            color: #dde2f0;
        }
        .empty-state p {
            font-size: 0.8rem;
            color: #4a5270;
        }
        .result-state {
            gap: 16px;
            max-width: 100%;
        }
        .image-frame {
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.08);
            background: #0c0f18;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            max-width: 100%;
        }
        .generated-img {
            max-width: 100%;
            max-height: calc(100vh - 140px);
            object-fit: contain;
            display: block;
        }
        .download-panel {
            display: flex;
            gap: 24px;
            align-items: center;
            margin-top: 8px;
        }
        .download-link {
            background: #111520;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 40px;
            padding: 6px 16px;
            font-size: 12px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 500;
            color: #dde2f0;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.1s;
        }
        .download-link:hover {
            background: #1e2338;
            border-color: #5b8fff;
        }
        .resolution-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: #4a5270;
        }
        .hidden {
            display: none !important;
        }
        /* skeleton styling */
        .skeleton-state {
            width: 100%;
            display: flex;
            justify-content: center;
        }
        .skeleton-card {
            background: #0c0f18;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 24px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            backdrop-filter: blur(2px);
        }
        .shimmer {
            position: relative;
            background: linear-gradient(110deg, rgba(255,255,255,0.02) 0%, rgba(255,255,255,0.08) 35%, rgba(255,255,255,0.02) 65%);
            background-size: 200% 100%;
            animation: shimmerMove 1.4s infinite ease-in-out;
        }
        @keyframes shimmerMove {
            0% { background-position: -100% 0; }
            100% { background-position: 200% 0; }
        }
        .skeleton-card .skeleton-icon svg {
            opacity: 0.2;
        }
        .generating-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: #4a5270;
        }
        .generating-text:after {
            content: '';
            animation: dots 1.4s steps(3, end) infinite;
        }
        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
            100% { content: ''; }
        }

        /* responsive */
        @media (max-width: 780px) {
            .main-layout {
                flex-direction: column;
            }
            .left-panel {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid rgba(255,255,255,0.06);
                max-height: 45%;
            }
            .right-panel {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
<div class="ambient-gradients">
    <div class="gradient-blue"></div>
    <div class="gradient-purple"></div>
</div>
<div class="app">
    <div class="topbar">
        <div class="logo-mark">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 4L13.5 9L18 10.5L13.5 12L12 17L10.5 12L6 10.5L10.5 9L12 4Z" fill="white" stroke="white" stroke-width="1.2"/>
                <path d="M19 15L19.5 17L21 17.5L19.5 18L19 20L18.5 18L17 17.5L18.5 17L19 15Z" fill="white"/>
            </svg>
        </div>
        <span class="brand-text">Gerador de Imagens</span>
        <span class="brand-by">by rcruzoe</span>
    </div>
    <div class="main-layout">
        <!-- LEFT PANEL -->
        <div class="left-panel">
            <div class="muted-label">Descreva sua imagem</div>
            <div class="prompt-container">
                <textarea id="promptTextarea" placeholder="ex: uma paisagem futurista com montanhas neon, céu estrelado..." rows="4"></textarea>
                <div class="toolbar">
                    <div class="ratio-buttons" id="ratioButtons">
                        <button class="ratio-btn active" data-ratio="1:1">
                            <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                                <rect x="5" y="5" width="18" height="18" rx="2" fill="rgba(91,143,255,0.2)" stroke="#5b8fff" stroke-width="1.5"/>
                            </svg>
                            <span class="ratio-label">1:1</span>
                        </button>
                        <button class="ratio-btn" data-ratio="9:16">
                            <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                                <rect x="8" y="4" width="12" height="20" rx="2" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
                            </svg>
                            <span class="ratio-label">9:16</span>
                        </button>
                        <button class="ratio-btn" data-ratio="16:9">
                            <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                                <rect x="4" y="8" width="20" height="12" rx="2" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
                            </svg>
                            <span class="ratio-label">16:9</span>
                        </button>
                    </div>
                    <div class="char-counter" id="charCounter">0 car.</div>
                </div>
            </div>
            <div class="error-box" id="errorBox"></div>
            <button class="generate-btn" id="generateBtn">
                <span class="btn-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 4L13.5 9L18 10.5L13.5 12L12 17L10.5 12L6 10.5L10.5 9L12 4Z" fill="white"/>
                        <path d="M19 15L19.5 17L21 17.5L19.5 18L19 20L18.5 18L17 17.5L18.5 17L19 15Z" fill="white"/>
                    </svg>
                </span>
                <span class="spinner"></span>
                <span>Gerar Imagem</span>
            </button>
            <div class="tip-text">
                <kbd>Ctrl</kbd> + <kbd>Enter</kbd> para gerar
            </div>
        </div>

        <!-- RIGHT PANEL: dynamic states -->
        <div class="right-panel" id="rightPanel">
            <!-- empty state -->
            <div id="emptyState" class="state-container empty-state">
                <div class="icon-round">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#4a5270" stroke-width="1.2">
                        <rect x="3" y="3" width="18" height="18" rx="3" stroke="currentColor" fill="none"/>
                        <circle cx="9" cy="9" r="1.5" fill="currentColor"/>
                        <circle cx="15" cy="9" r="1.5" fill="currentColor"/>
                        <path d="M8 15L12 12L16 15" stroke="currentColor" fill="none"/>
                    </svg>
                </div>
                <h3>Sua imagem aparece aqui</h3>
                <p>Descreva sua ideia e clique em gerar</p>
            </div>
            <!-- skeleton loading state (hidden initially) -->
            <div id="skeletonState" class="state-container skeleton-state hidden">
                <div id="skeletonBox" class="skeleton-card shimmer" style="aspect-ratio: 1/1; width: 80%; max-width: 480px; padding: 40px 20px;">
                    <div class="skeleton-icon">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#4a5270">
                            <rect x="4" y="4" width="16" height="16" rx="2" stroke="currentColor" fill="none"/>
                            <path d="M8 12L10 10L14 14L18 10" stroke="currentColor" fill="none"/>
                        </svg>
                    </div>
                    <div class="generating-text">Gerando</div>
                </div>
            </div>
            <!-- result state (hidden) -->
            <div id="resultState" class="state-container result-state hidden">
                <div class="image-frame" id="imageFrame">
                    <img id="generatedImage" class="generated-img" alt="imagem gerada">
                </div>
                <div class="download-panel">
                    <a id="downloadLink" class="download-link" download="imagem_gerada.png" href="#">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 3v12m0 0l-3-3m3 3l3-3M5 17v2a2 2 0 002 2h10a2 2 0 002-2v-2"/>
                        </svg>
                        Baixar PNG
                    </a>
                    <span id="resolutionLabel" class="resolution-label">1920 × 1920</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        // Hardcoded API endpoint from provided URL
        const API_ENDPOINT = "https://imagens.rcruzoe4.workers.dev/v1/images/generations";
        
        // DOM elements
        const promptInput = document.getElementById('promptTextarea');
        const charCounterSpan = document.getElementById('charCounter');
        const generateBtn = document.getElementById('generateBtn');
        const errorBox = document.getElementById('errorBox');
        const ratioBtns = document.querySelectorAll('.ratio-btn');
        const emptyStateDiv = document.getElementById('emptyState');
        const skeletonStateDiv = document.getElementById('skeletonState');
        const resultStateDiv = document.getElementById('resultState');
        const generatedImage = document.getElementById('generatedImage');
        const downloadLink = document.getElementById('downloadLink');
        const resolutionSpan = document.getElementById('resolutionLabel');
        const skeletonBox = document.getElementById('skeletonBox');

        let selectedRatio = "1:1";
        let currentBase64 = "";

        function updateCharacterCounter() {
            const len = promptInput.value.length;
            charCounterSpan.innerText = `${len} car.`;
        }

        function setActiveRatio(ratio) {
            ratioBtns.forEach(btn => {
                const r = btn.getAttribute('data-ratio');
                if (r === ratio) {
                    btn.classList.add('active');
                    const svgRect = btn.querySelector('svg rect');
                    if (svgRect) {
                        svgRect.setAttribute('fill', 'rgba(91,143,255,0.2)');
                        svgRect.setAttribute('stroke', '#5b8fff');
                    }
                } else {
                    btn.classList.remove('active');
                    const svgRect = btn.querySelector('svg rect');
                    if (svgRect) {
                        svgRect.setAttribute('fill', 'rgba(255,255,255,0.06)');
                        svgRect.setAttribute('stroke', 'rgba(255,255,255,0.25)');
                    }
                }
            });
        }

        ratioBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                const ratio = btn.getAttribute('data-ratio');
                selectedRatio = ratio;
                setActiveRatio(ratio);
            });
        });

        function setLoading(isLoading) {
            if (isLoading) {
                generateBtn.classList.add('loading');
                generateBtn.disabled = true;
                emptyStateDiv.classList.add('hidden');
                resultStateDiv.classList.add('hidden');
                skeletonStateDiv.classList.remove('hidden');
                updateSkeletonDimensions();
            } else {
                generateBtn.classList.remove('loading');
                generateBtn.disabled = false;
            }
        }

        function updateSkeletonDimensions() {
            if (!skeletonBox) return;
            skeletonBox.classList.add('shimmer');
            if (selectedRatio === '1:1') {
                skeletonBox.style.aspectRatio = '1 / 1';
                skeletonBox.style.width = '80%';
                skeletonBox.style.maxWidth = '480px';
            } else if (selectedRatio === '9:16') {
                skeletonBox.style.aspectRatio = '9 / 16';
                skeletonBox.style.width = '55%';
                skeletonBox.style.maxWidth = '280px';
            } else if (selectedRatio === '16:9') {
                skeletonBox.style.aspectRatio = '16 / 9';
                skeletonBox.style.width = '100%';
                skeletonBox.style.maxWidth = '720px';
            }
        }

        function showError(msg) {
            errorBox.innerText = msg;
            errorBox.classList.add('show');
            setTimeout(() => {
                errorBox.classList.remove('show');
            }, 5000);
        }

        function clearError() {
            errorBox.classList.remove('show');
            errorBox.innerText = '';
        }

        function getResolutionText(ratio) {
            if (ratio === '1:1') return '1920 × 1920';
            if (ratio === '9:16') return '1080 × 1920';
            if (ratio === '16:9') return '1920 × 1080';
            return '1920 × 1920';
        }

        async function generateImage() {
            const promptText = promptInput.value.trim();
            if (!promptText) {
                showError('Por favor, descreva a imagem antes de gerar.');
                return;
            }
            clearError();
            setLoading(true);
            try {
                const payload = {
                    prompt: promptText,
                    ratio: selectedRatio
                };
                const response = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer 0001'
                    },
                    body: JSON.stringify(payload)
                });
                if (!response.ok) {
                    let errMsg = `Erro HTTP ${response.status}`;
                    try {
                        const errJson = await response.json();
                        errMsg = errJson.message || errMsg;
                    } catch(e) {}
                    throw new Error(errMsg);
                }
                const data = await response.json();
                if (data && data.data && data.data[0] && data.data[0].b64_json) {
                    const b64 = data.data[0].b64_json;
                    currentBase64 = b64;
                    const imageSrc = `data:image/png;base64,${b64}`;
                    generatedImage.src = imageSrc;
                    downloadLink.href = imageSrc;
                    const resText = getResolutionText(selectedRatio);
                    resolutionSpan.innerText = resText;
                    emptyStateDiv.classList.add('hidden');
                    skeletonStateDiv.classList.add('hidden');
                    resultStateDiv.classList.remove('hidden');
                } else {
                    throw new Error('Resposta inesperada: formato inválido');
                }
            } catch (err) {
                console.error(err);
                showError(`Falha na geração: ${err.message}`);
                emptyStateDiv.classList.remove('hidden');
                skeletonStateDiv.classList.add('hidden');
                resultStateDiv.classList.add('hidden');
            } finally {
                setLoading(false);
            }
        }

        function handleKeyDown(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                generateImage();
            }
        }

        // Event listeners
        promptInput.addEventListener('input', () => {
            updateCharacterCounter();
            clearError();
        });
        generateBtn.addEventListener('click', generateImage);
        document.addEventListener('keydown', handleKeyDown);
        
        // Initialize
        updateCharacterCounter();
        setActiveRatio('1:1');
        
        // Test API connectivity on load (optional, silent)
        console.log('API Endpoint configured:', API_ENDPOINT);
    })();
</script>
</body>
</html>
