<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>✨ Gerador de Imagens IA | MagicShot ✨</title>
    <!-- Google Fonts: Space Grotesk & JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
    <!-- Emoji Favicon (modern browsers) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50' y='85' font-size='85' text-anchor='middle' fill='%235b8fff'>✨</text></svg>">
    <meta name="theme-color" content="#06080d">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #06080d;
            color: #eef2ff;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
        }

        /* enhanced ambient gradients + noise texture */
        .ambient-gradients {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .gradient-blue {
            position: absolute;
            top: -20%;
            left: -20%;
            width: 70%;
            height: 70%;
            background: radial-gradient(ellipse at 30% 40%, rgba(91,143,255,0.12), transparent 70%);
            border-radius: 50%;
            filter: blur(70px);
        }
        .gradient-purple {
            position: absolute;
            bottom: -20%;
            right: -20%;
            width: 70%;
            height: 70%;
            background: radial-gradient(ellipse at 70% 80%, rgba(180, 130, 255, 0.1), transparent 70%);
            border-radius: 50%;
            filter: blur(70px);
        }
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='1' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 1;
            opacity: 0.4;
        }

        /* main grid layout */
        .app {
            position: relative;
            z-index: 2;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* TOPBAR: refined with emoji and glow */
        .topbar {
            height: 56px;
            width: 100%;
            background: rgba(12, 15, 24, 0.7);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            display: flex;
            align-items: center;
            padding: 0 32px;
            transition: all 0.2s;
        }
        .logo-mark {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #5b8fff 0%, #8b6eff 100%);
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            box-shadow: 0 6px 14px rgba(91,143,255,0.25);
        }
        .logo-mark span {
            font-size: 20px;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.2));
        }
        .brand-text {
            font-weight: 700;
            font-size: 1.1rem;
            background: linear-gradient(135deg, #ffffff 0%, #b7c9ff 100%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }
        .brand-by {
            font-weight: 400;
            color: #5b6c9c;
            margin-left: 8px;
            font-size: 0.85rem;
            background: rgba(255,255,255,0.05);
            padding: 2px 8px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
        }

        /* two-column body */
        .main-layout {
            flex: 1;
            display: flex;
            min-height: 0;
            overflow: hidden;
        }

        /* LEFT PANEL — glassmorphism */
        .left-panel {
            width: 420px;
            background: rgba(12, 15, 24, 0.6);
            backdrop-filter: blur(12px);
            border-right: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            padding: 32px 28px;
            gap: 24px;
            overflow-y: auto;
            scrollbar-width: thin;
        }

        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 36px;
            overflow: auto;
            background: radial-gradient(ellipse at 30% 40%, rgba(12,15,24,0.2), transparent);
        }

        /* labels with emoji */
        .muted-label {
            font-size: 0.7rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #8f9bb5;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .muted-label span {
            font-size: 1rem;
        }

        /* prompt container premium */
        .prompt-container {
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(8, 10, 18, 0.7);
            backdrop-filter: blur(4px);
            transition: all 0.25s ease;
            overflow: hidden;
        }
        .prompt-container:focus-within {
            border-color: rgba(91,143,255,0.6);
            box-shadow: 0 0 0 4px rgba(91,143,255,0.2);
            background: rgba(10, 12, 22, 0.9);
        }
        textarea {
            width: 100%;
            background: transparent;
            border: none;
            padding: 20px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.95rem;
            line-height: 1.55;
            color: #f0f3fe;
            resize: none;
            outline: none;
            min-height: 140px;
        }
        textarea::placeholder {
            font-style: italic;
            color: #5b6c9c;
            font-weight: 400;
        }
        .toolbar {
            border-top: 1px solid rgba(255,255,255,0.05);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.2);
        }
        .ratio-buttons {
            display: flex;
            gap: 16px;
        }
        .ratio-btn {
            background: rgba(20, 24, 36, 0.6);
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }
        .ratio-btn:hover {
            background: rgba(91,143,255,0.15);
            transform: translateY(-2px);
        }
        .ratio-btn svg rect {
            transition: fill 0.2s, stroke 0.2s;
        }
        .ratio-btn .ratio-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            font-weight: 400;
            color: #8f9bb5;
        }
        .ratio-btn.active {
            background: rgba(91,143,255,0.2);
            box-shadow: 0 2px 8px rgba(91,143,255,0.2);
        }
        .ratio-btn.active .ratio-label {
            color: #5b8fff;
            font-weight: 500;
        }
        .char-counter {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            background: rgba(0,0,0,0.4);
            padding: 4px 10px;
            border-radius: 40px;
            color: #9aa9c7;
        }

        /* error box elegant */
        .error-box {
            background: rgba(220, 50, 70, 0.12);
            border-left: 4px solid #ff5c6e;
            padding: 12px 16px;
            border-radius: 20px;
            font-size: 13px;
            color: #ffb3bb;
            backdrop-filter: blur(4px);
            display: none;
        }
        .error-box.show {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* generate button 3D + emoji */
        .generate-btn {
            background: linear-gradient(105deg, #5b8fff 0%, #7c5eff 100%);
            width: 100%;
            border: none;
            border-radius: 40px;
            padding: 16px 0;
            font-weight: 600;
            font-size: 15px;
            font-family: 'Space Grotesk', sans-serif;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 8px 24px rgba(91,143,255,0.3);
            transition: all 0.2s ease;
            cursor: pointer;
            letter-spacing: 0.3px;
        }
        .generate-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 14px 32px rgba(91,143,255,0.45);
            filter: brightness(1.02);
        }
        .generate-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        .btn-icon {
            font-size: 20px;
            filter: drop-shadow(0 1px 1px rgba(0,0,0,0.2));
        }
        .generate-btn.loading .btn-icon {
            display: none;
        }
        .generate-btn.loading .spinner {
            display: inline-block;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .tip-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: #6e7ca3;
            text-align: center;
            margin-top: 8px;
            background: rgba(0,0,0,0.3);
            padding: 6px 12px;
            border-radius: 60px;
            width: fit-content;
            align-self: center;
        }
        kbd {
            background: #1c2132;
            border-radius: 8px;
            padding: 2px 8px;
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            color: #cbd5ff;
            margin: 0 3px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
        }

        /* Right panel states: premium */
        .empty-state, .result-state, .skeleton-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98);}
            to { opacity: 1; transform: scale(1);}
        }
        .empty-state {
            opacity: 0.7;
            text-align: center;
            gap: 20px;
        }
        .icon-round {
            background: rgba(17, 21, 32, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.08);
            width: 80px;
            height: 80px;
            border-radius: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            box-shadow: 0 10px 20px -5px rgba(0,0,0,0.3);
        }
        .empty-state h3 {
            font-weight: 600;
            font-size: 1.2rem;
            background: linear-gradient(135deg, #eef2ff, #b2c4ff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .empty-state p {
            font-size: 0.85rem;
            color: #7b89ae;
        }
        .result-state {
            gap: 20px;
        }
        .image-frame {
            border-radius: 28px;
            border: 1px solid rgba(255,255,255,0.1);
            background: #0a0d16;
            overflow: hidden;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.5);
            transition: all 0.2s;
        }
        .generated-img {
            max-width: 100%;
            max-height: calc(100vh - 160px);
            object-fit: contain;
            display: block;
        }
        .download-panel {
            display: flex;
            gap: 28px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        .download-link {
            background: rgba(20, 24, 38, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(91,143,255,0.3);
            border-radius: 60px;
            padding: 8px 22px;
            font-size: 13px;
            font-weight: 600;
            color: #eef2ff;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: 0.2s;
        }
        .download-link:hover {
            background: #5b8fff;
            border-color: white;
            color: white;
            transform: scale(1.02);
        }
        .resolution-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            background: rgba(0,0,0,0.4);
            padding: 5px 12px;
            border-radius: 40px;
            color: #9aa9c7;
        }
        .hidden {
            display: none !important;
        }

        /* skeleton with shimmer and emoji */
        .skeleton-card {
            background: rgba(12, 15, 24, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 32px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        .shimmer {
            background: linear-gradient(110deg, rgba(255,255,255,0.02) 0%, rgba(255,255,255,0.08) 35%, rgba(255,255,255,0.02) 65%);
            background-size: 200% 100%;
            animation: shimmerMove 1.5s infinite ease-in-out;
        }
        @keyframes shimmerMove {
            0% { background-position: -100% 0; }
            100% { background-position: 200% 0; }
        }
        .generating-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: #8b9bcf;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .generating-text:after {
            content: ' ✨';
            animation: pulseDot 1.2s infinite;
        }
        @keyframes pulseDot {
            0% { opacity: 0.4; content: ' .';}
            33% { opacity: 1; content: ' ..';}
            66% { content: ' ...';}
            100% { opacity: 0.6; content: ' ✨';}
        }

        @media (max-width: 780px) {
            .left-panel {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid rgba(255,255,255,0.06);
                max-height: 48%;
                backdrop-filter: blur(12px);
            }
            .right-panel {
                padding: 24px;
            }
            .topbar {
                padding: 0 20px;
            }
        }

        /* scroll personalization */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #0c0f18;
        }
        ::-webkit-scrollbar-thumb {
            background: #5b8fff;
            border-radius: 10px;
        }
    </style>
</head>
<body>
<div class="ambient-gradients">
    <div class="gradient-blue"></div>
    <div class="gradient-purple"></div>
</div>
<div class="noise-overlay"></div>
<div class="app">
    <div class="topbar">
        <div class="logo-mark">
            <span>✨</span>
        </div>
        <span class="brand-text">Gerador de Imagens</span>
        <span class="brand-by">by rcruzoe 🎨</span>
    </div>
    <div class="main-layout">
        <!-- LEFT PANEL -->
        <div class="left-panel">
            <div class="muted-label">
                <span>🎨</span> Descreva sua imagem
            </div>
            <div class="prompt-container">
                <textarea id="promptTextarea" placeholder="🌌 Ex: um dragão de luz neon voando sobre Tóquio cyberpunk, chuva de hologramas..."></textarea>
                <div class="toolbar">
                    <div class="ratio-buttons" id="ratioButtons">
                        <button class="ratio-btn active" data-ratio="1:1">
                            <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                                <rect x="5" y="5" width="18" height="18" rx="3" fill="rgba(91,143,255,0.2)" stroke="#5b8fff" stroke-width="1.5"/>
                            </svg>
                            <span class="ratio-label">⬛ 1:1</span>
                        </button>
                        <button class="ratio-btn" data-ratio="9:16">
                            <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                                <rect x="8" y="4" width="12" height="20" rx="3" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
                            </svg>
                            <span class="ratio-label">📱 9:16</span>
                        </button>
                        <button class="ratio-btn" data-ratio="16:9">
                            <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                                <rect x="4" y="8" width="20" height="12" rx="3" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
                            </svg>
                            <span class="ratio-label">🖥️ 16:9</span>
                        </button>
                    </div>
                    <div class="char-counter" id="charCounter">0 car.</div>
                </div>
            </div>
            <div class="error-box" id="errorBox">
                <span>⚠️</span> <span id="errorMsg"></span>
            </div>
            <button class="generate-btn" id="generateBtn">
                <span class="btn-icon">✨🎨</span>
                <span class="spinner"></span>
                <span>Gerar Imagem</span>
            </button>
            <div class="tip-text">
                <kbd>⌘ Ctrl</kbd> + <kbd>⏎ Enter</kbd> para criar magia
            </div>
        </div>

        <!-- RIGHT PANEL: dynamic states -->
        <div class="right-panel" id="rightPanel">
            <!-- empty state -->
            <div id="emptyState" class="state-container empty-state">
                <div class="icon-round">
                    🖼️✨
                </div>
                <h3>Sua imagem aparece aqui</h3>
                <p>💡 Descreva sua visão criativa e clique em gerar</p>
            </div>
            <!-- skeleton loading state -->
            <div id="skeletonState" class="state-container skeleton-state hidden">
                <div id="skeletonBox" class="skeleton-card shimmer" style="aspect-ratio: 1/1; width: 80%; max-width: 480px; padding: 48px 20px;">
                    <div class="skeleton-icon" style="font-size: 48px;">🎨✨</div>
                    <div class="generating-text">Gerando sua arte</div>
                </div>
            </div>
            <!-- result state -->
            <div id="resultState" class="state-container result-state hidden">
                <div class="image-frame" id="imageFrame">
                    <img id="generatedImage" class="generated-img" alt="imagem gerada">
                </div>
                <div class="download-panel">
                    <a id="downloadLink" class="download-link" download="imagem_gerada.png" href="#">
                        ⬇️ Baixar PNG
                    </a>
                    <span id="resolutionLabel" class="resolution-label">📐 1920 × 1920</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        // API endpoint from user provided Cloudflare Worker
        const API_ENDPOINT = "https://imagens.rcruzoe4.workers.dev/v1/images/generations";
        
        // DOM elements
        const promptInput = document.getElementById('promptTextarea');
        const charCounterSpan = document.getElementById('charCounter');
        const generateBtn = document.getElementById('generateBtn');
        const errorBox = document.getElementById('errorBox');
        const errorMsgSpan = document.getElementById('errorMsg');
        const ratioBtns = document.querySelectorAll('.ratio-btn');
        const emptyStateDiv = document.getElementById('emptyState');
        const skeletonStateDiv = document.getElementById('skeletonState');
        const resultStateDiv = document.getElementById('resultState');
        const generatedImage = document.getElementById('generatedImage');
        const downloadLink = document.getElementById('downloadLink');
        const resolutionSpan = document.getElementById('resolutionLabel');
        const skeletonBox = document.getElementById('skeletonBox');

        let selectedRatio = "1:1";
        let currentBase64 = "";

        function updateCharacterCounter() {
            const len = promptInput.value.length;
            charCounterSpan.innerText = `${len} car. ✍️`;
        }

        function setActiveRatio(ratio) {
            ratioBtns.forEach(btn => {
                const r = btn.getAttribute('data-ratio');
                const svgRect = btn.querySelector('svg rect');
                if (r === ratio) {
                    btn.classList.add('active');
                    if (svgRect) {
                        svgRect.setAttribute('fill', 'rgba(91,143,255,0.25)');
                        svgRect.setAttribute('stroke', '#5b8fff');
                    }
                } else {
                    btn.classList.remove('active');
                    if (svgRect) {
                        svgRect.setAttribute('fill', 'rgba(255,255,255,0.06)');
                        svgRect.setAttribute('stroke', 'rgba(255,255,255,0.25)');
                    }
                }
            });
        }

        ratioBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                const ratio = btn.getAttribute('data-ratio');
                selectedRatio = ratio;
                setActiveRatio(ratio);
            });
        });

        function setLoading(isLoading) {
            if (isLoading) {
                generateBtn.classList.add('loading');
                generateBtn.disabled = true;
                emptyStateDiv.classList.add('hidden');
                resultStateDiv.classList.add('hidden');
                skeletonStateDiv.classList.remove('hidden');
                updateSkeletonDimensions();
            } else {
                generateBtn.classList.remove('loading');
                generateBtn.disabled = false;
            }
        }

        function updateSkeletonDimensions() {
            if (!skeletonBox) return;
            skeletonBox.classList.add('shimmer');
            if (selectedRatio === '1:1') {
                skeletonBox.style.aspectRatio = '1 / 1';
                skeletonBox.style.width = '70%';
                skeletonBox.style.maxWidth = '460px';
            } else if (selectedRatio === '9:16') {
                skeletonBox.style.aspectRatio = '9 / 16';
                skeletonBox.style.width = '50%';
                skeletonBox.style.maxWidth = '280px';
            } else if (selectedRatio === '16:9') {
                skeletonBox.style.aspectRatio = '16 / 9';
                skeletonBox.style.width = '85%';
                skeletonBox.style.maxWidth = '760px';
            }
        }

        function showError(msg) {
            errorMsgSpan.innerText = msg;
            errorBox.classList.add('show');
            setTimeout(() => {
                errorBox.classList.remove('show');
            }, 5000);
        }

        function clearError() {
            errorBox.classList.remove('show');
            errorMsgSpan.innerText = '';
        }

        function getResolutionText(ratio) {
            if (ratio === '1:1') return '📐 1920 × 1920';
            if (ratio === '9:16') return '📱 1080 × 1920';
            if (ratio === '16:9') return '🖥️ 1920 × 1080';
            return '📐 1920 × 1920';
        }

        async function generateImage() {
            const promptText = promptInput.value.trim();
            if (!promptText) {
                showError('✨ Ops! Descreva sua imagem primeiro ✨');
                return;
            }
            clearError();
            setLoading(true);
            try {
                const payload = {
                    prompt: promptText,
                    ratio: selectedRatio
                };
                const response = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer 0001'
                    },
                    body: JSON.stringify(payload)
                });
                if (!response.ok) {
                    let errMsg = `Erro ${response.status}`;
                    try {
                        const errJson = await response.json();
                        errMsg = errJson.message || errMsg;
                    } catch(e) {}
                    throw new Error(errMsg);
                }
                const data = await response.json();
                if (data && data.data && data.data[0] && data.data[0].b64_json) {
                    const b64 = data.data[0].b64_json;
                    currentBase64 = b64;
                    const imageSrc = `data:image/png;base64,${b64}`;
                    generatedImage.src = imageSrc;
                    downloadLink.href = imageSrc;
                    resolutionSpan.innerText = getResolutionText(selectedRatio);
                    emptyStateDiv.classList.add('hidden');
                    skeletonStateDiv.classList.add('hidden');
                    resultStateDiv.classList.remove('hidden');
                } else {
                    throw new Error('Formato inesperado da API');
                }
            } catch (err) {
                console.error(err);
                showError(`💥 Falha: ${err.message}`);
                emptyStateDiv.classList.remove('hidden');
                skeletonStateDiv.classList.add('hidden');
                resultStateDiv.classList.add('hidden');
            } finally {
                setLoading(false);
            }
        }

        function handleKeyDown(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                generateImage();
            }
        }

        promptInput.addEventListener('input', () => {
            updateCharacterCounter();
            clearError();
        });
        generateBtn.addEventListener('click', generateImage);
        document.addEventListener('keydown', handleKeyDown);
        
        updateCharacterCounter();
        setActiveRatio('1:1');
        console.log('✨ Magic Image Studio ready | endpoint:', API_ENDPOINT);
    })();
</script>
</body>
</html>
